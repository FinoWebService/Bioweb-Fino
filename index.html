<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ================= SEO & META ================= -->
  <!-- Ganti seluruh nilai placeholder di bawah ini sesuai identitas Anda -->
  <title>Nama Anda — Bio Link</title>
  <meta name="description" content="Semua platform, konten, dan link penting Nama Anda tersedia di satu tempat." />
  <link rel="canonical" href="https://namadomainanda.com/" />

  <!-- Open Graph (tampilan saat dibagikan ke WhatsApp/Instagram/Twitter/dll) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://namadomainanda.com/" />
  <meta property="og:title" content="Nama Anda — Bio Link" />
  <meta property="og:description" content="Semua platform, konten, dan link penting Nama Anda tersedia di satu tempat." />
  <meta property="og:image" content="https://namadomainanda.com/assets/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Lompat langsung ke konten utama (aksesibilitas keyboard) -->
  <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

  <!-- Lapisan dekoratif: cahaya abstrak (glow) di belakang konten -->
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <div class="page">
    <div class="card" id="card">

      <!-- ================= HEADER: FOTO, NAMA, SAMBUTAN ================= -->
      <header class="profile">
        <div class="avatar-wrap">
          <!-- Ganti file assets/profile.jpg dengan foto Anda -->
          <img
            id="avatar"
            class="avatar"
            src="assets/profile.jpg"
            alt="Foto profil"
            width="116"
            height="116"
            loading="eager"
            fetchpriority="high"
            decoding="async"
            onerror="this.onerror=null;this.src='assets/profile-placeholder.svg'"
          />
        </div>

        <h1 id="profileName" class="name">Hello, I'm Dafino</h1>
        <p id="profileBio" class="bio">
        Semua link media sosial saya ada di satu laman
        </p>
      </header>

      <main id="main-content">

        <!-- ================= TAUTAN UTAMA ================= -->
        <!-- Konten di bawah adalah fallback statis (tetap berfungsi tanpa JavaScript). -->
        <!-- Jika JavaScript aktif, script.js akan menyinkronkan tautan ini dari CONFIG.links. -->
        <nav class="links" id="linksNav" aria-label="Tautan utama">
          <a
            class="link-btn link-btn--featured"
            data-link-id="cermatrix"
            href="https://finowebservice.github.io/kecermatan/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="6" width="20" height="12" rx="4" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7 10v4M5 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="16" cy="10.5" r="1" fill="currentColor"/>
                <circle cx="18.3" cy="12.8" r="1" fill="currentColor"/>
              </svg>
            </span>
            <span class="link-btn__text">CERMATRIX</span>
            <span class="link-btn__badge">Main</span>
          </a>
        </nav>

        <!-- ================= KONTAK (EMAIL SAJA) ================= -->
        <!-- Section ini hanya tampil jika CONFIG.email diisi di script.js. -->
        <!-- Sengaja TIDAK ada WhatsApp/telepon/formulir demi privasi. -->
        <section class="contact" id="emailSection" aria-label="Kontak email" hidden>
          <a class="link-btn link-btn--outline" id="emailButton" href="mailto:nama@email.com">
            <span class="link-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="link-btn__text">Email Saya</span>
          </a>
          <p class="contact-note">Untuk kerja sama atau pertanyaan profesional.</p>
        </section>

        <!-- ================= PORTFOLIO / KARYA UNGGULAN (OPSIONAL) ================= -->
        <!-- Section ini hanya tampil jika CONFIG.portfolio berisi minimal 1 item. -->
        <section class="portfolio" id="portfolioSection" aria-labelledby="portfolio-heading" hidden>
          <h2 id="portfolio-heading" class="section-heading">Karya Unggulan</h2>
          <div class="portfolio-grid" id="portfolioGrid"></div>
        </section>

        <!-- ================= MEDIA SOSIAL ================= -->
        <section class="socials" aria-label="Media sosial">
          <div class="socials-list" id="socialsList">
            <a class="social-icon" data-social-id="instagram" href="https://instagram.com/username" target="_blank" rel="noopener noreferrer" aria-label="Kunjungi Instagram saya" data-tip="Instagram">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
              </svg>
            </a>

            <a class="social-icon" data-social-id="tiktok" href="https://tiktok.com/@username" target="_blank" rel="noopener noreferrer" aria-label="Kunjungi TikTok saya" data-tip="TikTok">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 3v10.6a3.4 3.4 0 1 1-2.4-3.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 3c.5 2.4 2.2 4 4.6 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>

            <a class="social-icon" data-social-id="youtube" href="https://youtube.com/@username" target="_blank" rel="noopener noreferrer" aria-label="Kunjungi YouTube saya" data-tip="YouTube">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2.5" y="6" width="19" height="12" rx="4" stroke="currentColor" stroke-width="1.6"/>
                <path d="M10.5 9.5l4.5 2.5-4.5 2.5v-5z" fill="currentColor"/>
              </svg>
            </a>

            <a class="social-icon" data-social-id="facebook" href="https://facebook.com/username" target="_blank" rel="noopener noreferrer" aria-label="Kunjungi Facebook saya" data-tip="Facebook">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M13.6 21v-6.6h2.2l.3-2.6h-2.5V10c0-.75.2-1.26 1.28-1.26h1.37V6.4c-.24-.03-1.05-.1-2-.1-1.98 0-3.33 1.2-3.33 3.42v1.9H8.6v2.6h2.35V21" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </section>

      </main>

      <footer class="footer-note">
        <p><span id="year">2026</span> · Dibuat dengan ♥</p>
      </footer>

    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
